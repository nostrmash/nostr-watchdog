version: 2
updates:
  # pnpm-lock.yaml is the lockfile. The npm ecosystem covers pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development
    ignore:
      # typescript-eslint 8.73 accepts TypeScript >=4.8.4 <6.1.0.
      # 6.0.3 is the newest stable release inside that range. 7.0.2 fails lint.
      - dependency-name: typescript
        versions:
          - ">=6.1.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
