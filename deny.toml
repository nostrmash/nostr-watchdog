[advisories]
version = 2
yanked = "warn"
# chrono has no fixed release. The Worker SDK and timestamp formatting still
# link it. It is not used to parse untrusted input.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

# The pinned MDK repository's license covers both Markdown crates. Their
# manifests omit the license field.
[[licenses.clarify]]
crate = "marmot-markdown@0.20.0-dev"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0x20bd3f81 }]

[[licenses.clarify]]
crate = "marmot-markdown-ast@0.20.0-dev"
expression = "MIT"
license-files = [{ path = "../../LICENSE", hash = 0x20bd3f81 }]

[[licenses.exceptions]]
crate = "sqlcipher-src@420.0.0"
allow = ["blessing", "WTFPL"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/marmot-protocol/mdk",
    "https://github.com/nostrdevkit/nostr",
    "https://github.com/openmls/openmls.git",
    "https://github.com/yukibtc/async-utility",
]
