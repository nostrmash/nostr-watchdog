[workspace]

[package]
name = "watchdog-marmot"
version = "1.0.0-dev"
description = "Official MDK session for the native Nostr Watchdog."
edition = "2021"
license = "Unlicense"
publish = false
rust-version = "1.91"

[[bin]]
name = "watchdog-marmot"
path = "src/main.rs"

[dependencies]
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", rev = "ca52a04718628f08ed76b777df9c444594074182" }
hex = "0.4"
marmot-app = { git = "https://github.com/marmot-protocol/mdk", rev = "ca52a04718628f08ed76b777df9c444594074182" }
nostr = { git = "https://github.com/nostrdevkit/nostr", rev = "4904ffb85f60178375a1dda659a61793f36f03b8", features = ["nip59"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
watchdog-core = { path = "../watchdog-core" }
zeroize = "1"

[dev-dependencies]
base64 = "0.22"
hex = "0.4"
nostr = { git = "https://github.com/nostrdevkit/nostr", rev = "4904ffb85f60178375a1dda659a61793f36f03b8", features = ["nip59"] }
rusqlite = { version = "=0.40.2", default-features = false }

# MDK pins rusqlite 0.40, which requires libsqlite3-sys 0.38. Use the current
# upstream bindings and patched SQLCipher within this workspace.
[patch.crates-io]
libsqlite3-sys = { path = "../watchdog-sqlcipher-compat" }
