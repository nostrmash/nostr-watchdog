[package]
name = "watchdog-worker"
version = "1.0.0-dev"
description = "Cloudflare Workers entrypoint for Nostr Watchdog."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait = { workspace = true }
futures-util = "0.3"
js-sys = "0.3"
serde = { workspace = true }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = "0.2"
watchdog-core = { workspace = true }
watchdog-engine = { workspace = true }
watchdog-notify = { workspace = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
watchdog-store = { workspace = true }
worker = { version = "0.9", features = ["d1"] }
