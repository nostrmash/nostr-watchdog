# Staging Worker for the Rust rewrite. This file must not be used to update
# the production Worker "nostr-watchdog" or its D1 database.
# Deploy is manual: npx wrangler deploy --config wrangler.staging.toml
# GitHub Actions does not deploy this.

name = "nostr-watchdog-rust-staging"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-22"
workers_dev = true

[build]
command = "worker-build --release"

[limits]
cpu_ms = 30000

[triggers]
crons = ["* * * * *", "0 * * * *"]

[vars]
ENVIRONMENT = "staging"
WATCHDOG_ENABLED = "false"
ALERTS_ENABLED = "false"
ENABLE_MARMOT = "false"
ENABLE_NIP17 = "false"
# Set this as a secret on this Worker, not a var:
#   MARMOT_OPERATOR_TOKEN
# Do not put MARMOT_STORAGE_KEY on this Worker. That key belongs only to
# nostr-watchdog-marmot-staging. Use a dedicated sender and recipient.
# Do not reuse production identities.

# D1 is omitted until a staging database is created. Do not paste the
# production database id into this file. Alerts and Marmot stay off until
# a deliberate staging activation.

[[durable_objects.bindings]]
name = "MARMOT_SENDER"
class_name = "MarmotSender"
script_name = "nostr-watchdog-marmot-staging"
