# Staging Worker for the Rust rewrite. This file must not be used to update
# the production Worker "nostr-watchdog" or its D1 database.
# Deploy is manual: npx wrangler deploy --config wrangler.staging.toml
# GitHub Actions does not deploy this.

name = "nostr-watchdog-rust-staging"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-22"
workers_dev = true

[build]
command = "worker-build --release"

[limits]
cpu_ms = 30000

[triggers]
crons = ["* * * * *", "0 * * * *"]

[vars]
ENVIRONMENT = "staging"
WATCHDOG_ENABLED = "false"
ALERTS_ENABLED = "false"
ENABLE_MARMOT = "false"
ENABLE_NIP17 = "false"
# Set these as secrets, not vars, before any Marmot staging run:
#   MARMOT_OPERATOR_TOKEN
#   MARMOT_STORAGE_KEY
# Use a dedicated sender nsec and a dedicated recipient. Do not reuse production.

# D1 is omitted on purpose. Create a database named nostr-watchdog-rust-staging
# and add it here only after the Worker actually runs the shared engine.
# Do not paste the production database id into this file.
#
# The Marmot Durable Object class MarmotSender lives in
# crates/watchdog-marmot-worker. It is not linked into this Worker yet, so
# this file does not declare a MARMOT_SENDER binding. Adding the binding
# before the class is exported by this script would fail deployment.
# Keep ENABLE_MARMOT false until that link and a staging rehearsal exist.
